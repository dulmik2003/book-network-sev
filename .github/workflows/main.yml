name: BSN Backend API Pipeline

on:
  pull_request:
    branches:
      - main
    paths:
      - book-network-sev
      - 'Dockerfile'
      - 'docker-compose.yml'
      - .github/workflows/**

jobs:
  compile:
    runs-on: windows-latest
    name: Compile the project
    steps:
      - name: Pull the repository code into the runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'oracle'

      - name: Running Unit Tests
        run: mvnw clean compile

#  unit-tests:
